events {
  worker_connections 1024;
}

http {
  # ============================================
  # Rate limiting (protección fuerza bruta / abuso)
  # ============================================
  limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
  limit_req_status 429;

  # ============================================
  # gzip
  # ============================================
  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain application/json application/javascript text/css application/xml;

  # ============================================
  # CORS: solo orígenes permitidos (NO '*', compatible con credentials).
  # Echo del Origin solo si está en la allowlist; cambiar/añadir para producción.
  # ============================================
  map $http_origin $cors_origin {
    default "";
    "http://localhost:3004" "http://localhost:3004";
    "http://localhost:3005" "http://localhost:3005";
  }

  # ============================================
  # Resolver de Docker (127.0.0.11): resuelve los nombres de servicio en
  # tiempo de ejecución. Necesario porque las IPs de los contenedores cambian
  # al recrearlos; con upstreams estáticos nginx cacheaba una IP vieja → 502.
  # ============================================
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name localhost;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Cabeceras de proxy comunes
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    # Evitar CORS duplicado: los servicios Nest también emiten sus cabeceras CORS.
    # El gateway las oculta del upstream y deja UNA sola (las suyas, abajo), si no
    # el navegador recibe 'Access-Control-Allow-Origin' repetido y lo rechaza.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Cabeceras CORS (heredadas por las locations que no definen sus propias add_header)
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Content-Type, Authorization, Accept, Idempotency-Key, X-Request-Id' always;
    add_header Vary Origin always;

    # Preflight CORS global
    if ($request_method = OPTIONS) {
      return 204;
    }

    # ===== Rutas versionadas /api/v1/* (passthrough del path completo) =====

    # NOTA: se usa proxy_pass con VARIABLE (set $up ...) para forzar la resolución
    # DNS en tiempo de ejecución vía el resolver. Sin URI en proxy_pass, nginx
    # reenvía el path original completo (/api/v1/...).

    # Autenticación (user-login) — con rate limit más estricto.
    # Prefijo SIN barra final para matchear tanto /api/v1/auth como /api/v1/auth/...
    location /api/v1/auth {
      limit_req zone=auth_limit burst=10 nodelay;
      set $up_auth "user-login:3001";
      proxy_pass http://$up_auth;
    }

    # Perfiles y usuarios (user-service)
    location /api/v1/profiles {
      limit_req zone=general_limit burst=40 nodelay;
      set $up_user "user-service:3000";
      proxy_pass http://$up_user;
    }
    location /api/v1/users {
      limit_req zone=general_limit burst=40 nodelay;
      set $up_user "user-service:3000";
      proxy_pass http://$up_user;
    }

    # Préstamos (loan-service)
    location /api/v1/loans {
      limit_req zone=general_limit burst=40 nodelay;
      set $up_loan "loan-service:3001";
      proxy_pass http://$up_loan;
    }

    # Administración y análisis crediticio (admin-service)
    location /api/v1/admin {
      limit_req zone=general_limit burst=40 nodelay;
      set $up_admin "admin-service:3000";
      proxy_pass http://$up_admin;
    }
    location /api/v1/credit-analysis {
      limit_req zone=general_limit burst=40 nodelay;
      set $up_admin "admin-service:3000";
      proxy_pass http://$up_admin;
    }

    # Health del propio gateway
    location /health {
      access_log off;
      return 200 "OK\n";
      add_header Content-Type text/plain;
    }

    location / {
      return 404 "Not Found\n";
    }
  }
}
