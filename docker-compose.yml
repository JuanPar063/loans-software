services:
  # ===================================
  # BASES DE DATOS
  # ===================================

  postgres-user-service:
    image: postgres:14
    container_name: postgres-user-service
    environment:
      POSTGRES_DB: user-service-db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${USER_SERVICE_DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_user_service_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d user-service-db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loan-bank-network

  postgres-loan-service:
    image: postgres:14
    container_name: postgres-loan-service
    environment:
      POSTGRES_DB: loans-service
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${LOAN_SERVICE_DB_PASSWORD:-password}
    ports:
      - "5434:5432"
    volumes:
      - postgres_loan_service_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d loans-service"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loan-bank-network

  postgres-admin-service:
    image: postgres:14
    container_name: postgres-admin-service
    environment:
      POSTGRES_DB: admin_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ADMIN_SERVICE_DB_PASSWORD:-admin123}
    ports:
      - "5435:5432"
    volumes:
      - postgres_admin_service_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d admin_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loan-bank-network

  postgres-user-login:
    image: postgres:14
    container_name: postgres-user-login
    environment:
      POSTGRES_DB: user-login-db
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: ${USER_LOGIN_DB_PASSWORD:-password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_user_login_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d user-login-db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loan-bank-network

  # ===================================
  # MICROSERVICIOS
  # ===================================
  # NOTA: JWT_SECRET es el MISMO para todos (firma/verificación compartida).
  #       Definido por env (${JWT_SECRET}); en producción es OBLIGATORIO.

  user-service:
    build:
      context: ../user-service
      dockerfile: Dockerfile
      target: development
      cache_from:
        - node:20-alpine
    container_name: user-service
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: postgres-user-service
      DATABASE_PORT: 5432
      DATABASE_USER: admin
      DATABASE_PASSWORD: ${USER_SERVICE_DB_PASSWORD:-password}
      DATABASE_NAME: user-service-db
      DATABASE_SCHEMA: public
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3004,http://localhost:3005}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
    depends_on:
      postgres-user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - ../user-service:/app
      - /app/node_modules
    networks:
      - loan-bank-network
    restart: unless-stopped

  loan-service:
    build:
      context: ../loan-service
      dockerfile: Dockerfile
      target: development
      cache_from:
        - node:20-alpine
    container_name: loan-service
    ports:
      - "3002:3001"
    environment:
      DATABASE_HOST: postgres-loan-service
      DATABASE_PORT: 5432
      DATABASE_USER: admin
      DATABASE_PASSWORD: ${LOAN_SERVICE_DB_PASSWORD:-password}
      DATABASE_NAME: loans-service
      DATABASE_SCHEMA: user_service
      USER_SERVICE_URL: http://user-service:3000
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3004,http://localhost:3005}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      # --- Eventos serverless (publica a SNS; en dev apunta a LocalStack) ---
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
      LOAN_EVENTS_TOPIC_ARN: ${LOAN_EVENTS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:LoanEvents}
    depends_on:
      postgres-loan-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/v1/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - ../loan-service:/app
      - /app/node_modules
    networks:
      - loan-bank-network
    restart: unless-stopped

  admin-service:
    build:
      context: ../admin-service
      dockerfile: Dockerfile
      target: development
      cache_from:
        - node:20-alpine
    container_name: admin-service
    ports:
      - "3003:3000"
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres-admin-service
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: ${ADMIN_SERVICE_DB_PASSWORD:-admin123}
      DB_NAME: admin_service_db
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      LOAN_SERVICE_URL: http://loan-service:3001
      USER_SERVICE_URL: http://user-service:3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3004,http://localhost:3005}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
    depends_on:
      postgres-admin-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      loan-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - ../admin-service:/app
      - /app/node_modules
    networks:
      - loan-bank-network
    restart: unless-stopped

  user-login:
    build:
      context: ../user-login
      dockerfile: Dockerfile
      target: development
      cache_from:
        - node:20-alpine
    container_name: user-login
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_PORT: 3001
      DB_HOST: postgres-user-login
      DB_PORT: 5432
      DB_USERNAME: authuser
      DB_PASSWORD: ${USER_LOGIN_DB_PASSWORD:-password}
      DB_DATABASE: user-login-db
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      SALT_ROUNDS: ${SALT_ROUNDS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3004,http://localhost:3005}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
    depends_on:
      postgres-user-login:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/v1/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - ../user-login:/app
      - /app/node_modules
    networks:
      - loan-bank-network
    restart: unless-stopped

  # ===================================
  # FRONTEND
  # ===================================

  frontend:
    build:
      context: ../loans-frontend
      dockerfile: Dockerfile
      cache_from:
        - node:20-alpine
        - nginx:alpine
    container_name: loans-frontend
    ports:
      - "3004:80"
    depends_on:
      - user-login
      - user-service
      - loan-service
      - admin-service
    networks:
      - loan-bank-network
    restart: unless-stopped

  # ===================================
  # API GATEWAY (NGINX)
  # ===================================

  gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "3005:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - loan-service
      - admin-service
      - user-login
    networks:
      - loan-bank-network
    restart: unless-stopped

  # ===================================
  # LOCALSTACK (AWS local: SNS, SQS, Lambda, DynamoDB)
  # Para la pila serverless definida en ./infra (AWS CDK).
  # ===================================
  localstack:
    image: localstack/localstack:3
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sns,sqs,lambda,dynamodb,cloudformation,iam,sts,logs,s3
      - DEBUG=0
      - LAMBDA_DOCKER_NETWORK=loan-bank-network
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - loan-bank-network
    restart: unless-stopped

# ===================================
# VOLÚMENES PERSISTENTES
# ===================================
volumes:
  postgres_user_service_data:
    name: loan_bank_user_service_data
  postgres_loan_service_data:
    name: loan_bank_loan_service_data
  postgres_admin_service_data:
    name: loan_bank_admin_service_data
  postgres_user_login_data:
    name: loan_bank_user_login_data

# ===================================
# RED PERSONALIZADA
# ===================================
networks:
  loan-bank-network:
    name: loan-bank-network
    driver: bridge
